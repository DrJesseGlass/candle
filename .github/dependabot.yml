version: 2
updates:
  # production-djg-candle is the fork's default branch, so Dependabot alerts,
  # security updates and these version updates all apply to it. Fork main is a
  # pure mirror of upstream and carries no fork-specific config.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Pinned with "=" to track wasm-bindgen; bump by hand with the wasm examples.
      - dependency-name: "web-sys"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(ci)"
