name: Weekly cargo update

# Refreshes Cargo.lock and opens a PR. This covers the transitive (semver-compatible)
# fixes that Dependabot version updates do not file; Dependabot security updates
# cover the ones with a published advisory.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca  # stable
      - name: cargo update
        run: |
          cargo update 2>&1 | tee cargo-update.log
          git --no-pager diff --stat -- Cargo.lock
      - name: Audit the refreshed lockfile
        uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9  # v2.1.2
        with:
          command: check advisories
      - name: Build check
        run: cargo check --workspace --locked
      - name: Open PR
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1  # v8.1.3
        with:
          base: production-djg-candle
          branch: deps/weekly-cargo-update
          delete-branch: true
          add-paths: Cargo.lock
          commit-message: "chore(deps): cargo update"
          title: "chore(deps): weekly cargo update"
          body: |
            Automated cargo update on production-djg-candle.
            cargo deny check advisories and cargo check --workspace --locked passed on this lockfile.

            PRs opened with GITHUB_TOKEN do not trigger rust-ci. Push an empty commit
            or close and reopen to run it, or merge on the strength of the checks above.
